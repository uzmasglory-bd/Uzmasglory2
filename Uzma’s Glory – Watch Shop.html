<style>
:root{--bg:#fff7f3;--sf:#fff;--tx:#3a1a1f;--mu:#8a6b6b;--ac:#7a2432;--gd:#b98a4b;--rs:#f6d9d0;--ln:#ecd3ca;--on:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme=dark]{--bg:#1d1013;--sf:#2a171b;--tx:#f7e6e0;--mu:#c3a6a2;--ac:#e8a39a;--gd:#d9ae6c;--rs:#3a1f25;--ln:#4a2a31;--on:#1d1013;color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:calc(60px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 'Hind Siliguri',sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:30}
h1,h2,h3,.lg{font-family:'Cormorant Garamond',serif;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}:focus-visible{outline:2px solid var(--gd);outline-offset:2px}
.bt{background:var(--ac);color:var(--on);border:0;border-radius:8px;padding:9px 14px;font-weight:600}
.bt.o{background:none;color:var(--ac);border:1.5px solid var(--ac)}
hd,header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--sf);border-bottom:1px solid var(--ln)}
header .lg{flex:1;font-size:26px;color:var(--ac);text-align:center}
.ic{background:none;border:0;font-size:24px;position:relative;padding:4px 8px}
.ic b{position:absolute;top:-2px;right:-2px;background:var(--ac);color:var(--on);border-radius:9px;font-size:12px;padding:0 6px}
.hero{position:relative}.hero img{width:100%;display:block;max-height:70vh;object-fit:cover}
.hero .bt{position:absolute;left:50%;bottom:14px;transform:translateX(-50%)}
.tag{text-align:center;padding:14px;background:var(--rs);font-weight:600;color:var(--ac)}
.mq{overflow:hidden;padding:18px 0}.mq>div{display:flex;width:max-content;animation:mv 45s linear infinite}
@keyframes mv{to{transform:translateX(-50%)}}@media(prefers-reduced-motion:reduce){.mq>div{animation:none}}
.mq img{height:150px;width:120px;object-fit:cover;border-radius:12px;margin-right:12px;cursor:pointer}
section{padding:22px 14px;max-width:1100px;margin:auto}h2{font-size:32px;color:var(--ac);margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chips button{border:1px solid var(--ln);background:var(--sf);border-radius:20px;padding:4px 14px}.chips .on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.gr{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(min-width:760px){.gr{grid-template-columns:repeat(4,1fr)}}
.cd{background:var(--sf);border:1px solid var(--ln);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.cd img{width:100%;aspect-ratio:4/5;object-fit:cover;cursor:pointer}.cd div{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.cd small{color:var(--mu)}.pr{font-weight:600;color:var(--ac);font-size:18px}.cd .bt{padding:7px 4px;font-size:14px}.bx{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:auto}

#ov,#adm{position:fixed;inset:0;z-index:40;background:rgba(40,10,15,.55);display:flex;justify-content:center;align-items:flex-end;overflow:auto}
#ov>div{background:var(--sf);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
#ov.l{justify-content:flex-start;align-items:stretch}#ov.l>div{max-width:300px;border-radius:0;max-height:none;height:100%}
#adm{background:var(--bg);display:block;padding:12px 14px calc(30px + env(safe-area-inset-bottom,0px))}[hidden]{display:none!important}
.mn{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--ln);padding:11px 4px}
input,select,textarea{width:100%;padding:9px;margin:4px 0;border:1px solid var(--ln);border-radius:8px;background:var(--bg)}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}.row img{width:48px;height:48px;object-fit:cover;border-radius:6px}.row input{margin:0}
.tb{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tb button{border:1px solid var(--ln);background:var(--sf);border-radius:8px;padding:6px 12px}.tb .on{background:var(--ac);color:var(--on)}
.pay{display:flex;gap:8px;align-items:center;border:1px solid var(--ln);border-radius:10px;padding:8px;margin:6px 0}.pay input{width:auto}
footer{text-align:center;padding:24px;color:var(--mu);font-size:14px}.sm{font-size:13px;color:var(--mu)}

const tk=n=>'৳'+Number(n).toLocaleString('en-IN');let f={cat:'all',brand:''},cart=[];
const P=id=>st.products.find(p=>p.id==id);
function render(){
 $('#cv').src=st.cover;$('#tg').textContent=`বিকাশ/নগদে পেমেন্টে ${st.cfg.dc}% ছাড় · ক্যাশ অন ডেলিভারি আছে`;
 const all=st.products.map(p=>`<img src="${p.imgs[0].src}" alt="${esc(p.name)}" onclick="show(${p.id})">`).join('');
 $('#sl').innerHTML=all?`<div>${all+all}</div>`:'';
 const L=[['all','সব'],['women','মেয়েদের'],['men','ছেলেদের']];
 $('#ch').innerHTML=L.map(([k,l])=>`<button class="${f.cat==k&&!f.brand?'on':''}" onclick="flt('${k}','')">${l}</button>`).join('')+st.brands.map(b=>`<button class="${f.brand==b?'on':''}" onclick="flt('all',this.textContent)">${esc(b)}</button>`).join('');
 const ps=st.products.filter(p=>(f.cat=='all'||p.cat==f.cat)&&(!f.brand||p.brand==f.brand));
 $('#gr').innerHTML=ps.map(p=>`<div class="cd"><img src="${p.imgs[0].src}" alt="${esc(p.name)}" onclick="show(${p.id})"><div><small>${esc(p.brand)} · ${p.cat=='men'?'ছেলেদের':'মেয়েদের'}</small><h3>${esc(p.name)}</h3><span class="pr">${tk(p.price)}</span><span class="sm">${p.imgs.length>1?p.imgs.length+'টি রং':''}</span><div class="bx" style="padding:0"><button class="bt o" onclick="add(${p.id},0)">Add to Cart</button><button class="bt" onclick="buy(${p.id},0)">Buy Now</button></div></div></div>`).join('')||'<p>এই ক্যাটাগরিতে এখন কোনো ঘড়ি নেই।</p>';
 const r=st.reviews,has=r.length>0;$('#rvs').hidden=$('#rm').hidden=!has;
 if(has){let a=r;while(a.length<8)a=a.concat(r);const h=a.map(v=>`<div class="rv">${v.img?`<img src="${v.img}" alt="review">`:''}<b>${esc(v.name)}</b><br>${esc(v.txt)}</div>`).join('');$('#rm').innerHTML=`<div>${h+h}</div>`}
 $('#cn').textContent=cart.reduce((s,i)=>s+i.q,0);
}
function flt(c,b){f={cat:c,brand:b};cl();render();location.hash='shop'}
function ov(h,l){const o=$('#ov');o.className=l?'l':'';o.hidden=false;o.firstElementChild.innerHTML=h}
function cl(){$('#ov').hidden=true}
function menu(){ov(`<h3>ক্যাটাগরি</h3><button class="mn" onclick="flt('all','')">সব ঘড়ি</button><button class="mn" onclick="flt('women','')">মেয়েদের ঘড়ি</button><button class="mn" onclick="flt('men','')">ছেলেদের ঘড়ি</button><h3 style="margin-top:14px">ব্র্যান্ড</h3>`+st.brands.map(b=>`<button class="mn" onclick="flt('all',this.textContent)">${esc(b)}</button>`).join(''),1)}
function show(id,ci=0){const p=P(id);ov(`<img id="pm" src="${p.imgs[ci].src}" style="width:100%;border-radius:12px" alt=""><small>${esc(p.brand)}</small><h2>${esc(p.name)}</h2><span class="pr">${tk(p.price)}</span><p>${esc(p.desc||'')}</p><div class="row" style="flex-wrap:wrap">${p.imgs.map((m,i)=>`<button class="chips" style="border:${i==ci?2:1}px solid var(--ac);border-radius:20px;padding:3px 12px;background:var(--sf)" onclick="show(${id},${i})">${esc(m.c)}</button>`).join('')}</div><div class="bx"><button class="bt o" onclick="add(${id},${ci});cl()">Add to Cart</button><button class="bt" onclick="buy(${id},${ci})">Buy Now</button></div>`)}
function add(id,ci){const x=cart.find(i=>i.id==id&&i.ci==ci);x?x.q++:cart.push({id,ci,q:1});render();const b=$('#cn');b.style.transform='scale(1.5)';setTimeout(()=>b.style.transform='',250)}
function buy(id,ci){cart=[{id,ci,q:1}];render();cartUI()}
let pm='bk';
function cartUI(){
 if(!cart.length)return ov('<h3>কার্ট খালি</h3><p>পছন্দের ঘড়ি Add to Cart করুন।</p>');
 const sub=cart.reduce((s,i)=>s+P(i.id).price*i.q,0),d=pm=='cod'?0:Math.round(sub*st.cfg.dc/100);
 const pay=[['bk','বিকাশ',st.cfg.bk],['ng','নগদ',st.cfg.ng],['cod','ক্যাশ অন ডেলিভারি','']];
 ov(`<h3>আপনার কার্ট</h3>`+cart.map((i,n)=>{const p=P(i.id);return`<div class="row"><img src="${p.imgs[i.ci].src}" alt=""><div style="flex:1"><b>${esc(p.name)}</b><br><span class="sm">${esc(p.imgs[i.ci].c)} · ${tk(p.price)}</span></div><button class="bt o" onclick="qt(${n},-1)">−</button>${i.q}<button class="bt o" onclick="qt(${n},1)">+</button></div>`}).join('')+
 `<h3 style="margin-top:12px">পেমেন্ট</h3>`+pay.map(([k,l,num])=>`<label class="pay"><input type="radio" name="pm" ${pm==k?'checked':''} onchange="pm='${k}';cartUI()"><span><b>${l}</b>${k=='cod'?' <span class="sm">(ছাড় নেই)</span>':` <span class="sm">(${st.cfg.dc}% ছাড়)</span><br>Send Money: <b>${esc(num)}</b>`}</span></label>`).join('')+
 `<p>সাবটোটাল: ${tk(sub)}<br>${d?`ছাড়: −${tk(d)}<br>`:''}<b style="font-size:20px">মোট: ${tk(sub-d)}</b></p><input id="fn" placeholder="আপনার নাম"><input id="fp" type="tel" placeholder="মোবাইল নম্বর"><textarea id="fa" rows="2" placeholder="পূর্ণ ঠিকানা"></textarea>${pm!='cod'?'<input id="ft" placeholder="Transaction ID (টাকা পাঠানোর পর)">':''}<button class="bt" style="width:100%;margin-top:6px" onclick="order(${sub-d})">অর্ডার কনফার্ম করুন</button>`)}
function qt(n,d){cart[n].q+=d;if(cart[n].q<1)cart.splice(n,1);render();cartUI()}
function order(total){const v=i=>($('#'+i)?.value||'').trim(),n=v('fn'),ph=v('fp'),a=v('fa'),t=v('ft');
 if(!n||!/^01\d{9}$/.test(ph.replace(/\D/g,''))||!a)return alert('নাম, ১১ সংখ্যার মোবাইল নম্বর ও ঠিকানা দিন');
 if(pm!='cod'&&!t)return alert('Transaction ID দিন');
 const o={id:'UG'+Date.now().toString().slice(-6),n,ph,a,pm,t,total,at:new Date().toLocaleString('bn-BD'),items:cart.map(i=>`${P(i.id).name} (${P(i.id).imgs[i.ci].c}) ×${i.q}`)};
 st.orders.unshift(o);save();cart=[];render();ov(`<h2>ধন্যবাদ, ${esc(n)}!</h2><p>আপনার অর্ডার <b>${o.id}</b> পেয়েছি। মোট ${tk(total)}। শীঘ্রই কনফার্ম করতে ফোন করব।</p><button class="bt" onclick="cl()">ঠিক আছে</button>`)}

function gate(){if(location.hash!='#admin')return $('#adm').hidden=true;if(!gate.ok){if(prompt('Admin password')!==st.cfg.pw){location.hash='';return}gate.ok=1}ad()}
addEventListener('hashchange',gate);
function ad(){const T=(k,l)=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';dr=null;ad()">${l}</button>`;let b='';
 if(tab=='p')b=dr?`<input placeholder="ঘড়ির নাম" value="${esc(dr.name)}" oninput="dr.name=this.value"><select onchange="dr.brand=this.value">${st.brands.map(x=>`<option ${x==dr.brand?'selected':''}>${esc(x)}</option>`).join('')}</select><select onchange="dr.cat=this.value"><option value="women" ${dr.cat=='women'?'selected':''}>মেয়েদের</option><option value="men" ${dr.cat=='men'?'selected':''}>ছেলেদের</option></select><input type="number" placeholder="দাম (৳)" value="${dr.price||''}" oninput="dr.price=+this.value"><textarea rows="2" placeholder="বিবরণ" oninput="dr.desc=this.value">${esc(dr.desc)}</textarea><h3>রং ও ছবি</h3>${dr.imgs.map((m,i)=>`<div class="row"><img src="${m.src}" alt=""><input value="${esc(m.c)}" placeholder="রঙের নাম" oninput="dr.imgs[${i}].c=this.value"><button class="bt o" onclick="dr.imgs.splice(${i},1);ad()">✕</button></div>`).join('')}<label class="bt o" style="display:block;text-align:center">+ রং/ছবি যোগ করুন<input type="file" accept="image/*" multiple hidden onchange="addImgs(this.files)"></label><div class="row"><button class="bt" onclick="saveP()">Save</button><button class="bt o" onclick="dr=null;ad()">বাতিল</button></div>`
 :`<button class="bt" onclick="dr={name:'',brand:st.brands[0],cat:'women',price:0,desc:'',imgs:[]};ad()">+ নতুন ঘড়ি</button>`+st.products.map(p=>`<div class="row"><img src="${p.imgs[0].src}" alt=""><div style="flex:1"><b>${esc(p.name)}</b><br><span class="sm">${esc(p.brand)} · ${tk(p.price)}</span></div><button class="bt o" onclick="dr=JSON.parse(JSON.stringify(P(${p.id})));ad()">Edit</button><button class="bt o" onclick="if(confirm('মুছবেন?')){st.products=st.products.filter(x=>x.id!=${p.id});save();render();ad()}">🗑</button></div>`).join('');
 if(tab=='b')b=`<div class="row"><input id="nb" placeholder="নতুন ব্র্যান্ডের নাম"><button class="bt" onclick="const v=$('#nb').value.trim();if(v&&!st.brands.includes(v)){st.brands.push(v);save();render();ad()}">Add</button></div>`+st.brands.map((x,i)=>`<div class="row"><span style="flex:1">${esc(x)}</span><button class="bt o" onclick="st.brands.splice(${i},1);save();render();ad()">🗑</button></div>`).join('');
 if(tab=='r')b=`<input id="rn" placeholder="কাস্টমারের নাম"><textarea id="rt" rows="2" placeholder="রিভিউ লেখা"></textarea><input id="ri" type="file" accept="image/*"><button class="bt" onclick="addRv()">রিভিউ যোগ করুন</button>`+st.reviews.map((x,i)=>`<div class="row">${x.img?`<img src="${x.img}" alt="">`:''}<span style="flex:1">${esc(x.name)}: ${esc(x.txt)}</span><button class="bt o" onclick="st.reviews.splice(${i},1);save();render();ad()">🗑</button></div>`).join('');
 if(tab=='o')b=(st.orders.map(o=>`<div class="pay" style="display:block"><b>${o.id}</b> · ${esc(o.at)}<br>${esc(o.n)} · ${esc(o.ph)}<br>${esc(o.a)}<br>${o.items.map(esc).join('<br>')}<br><b>${tk(o.total)}</b> · ${o.pm=='cod'?'COD':o.pm=='bk'?'বিকাশ':'নগদ'} ${esc(o.t)}</div>`).join('')||'<p>এখনো কোনো অর্ডার নেই।</p>')+(st.orders.length?`<button class="bt o" onclick="if(confirm('সব অর্ডার মুছবেন?')){st.orders=[];save();ad()}">সব মুছুন</button>`:'');
 if(tab=='s'){const c=st.cfg;b=`<label>বিকাশ নম্বর<input value="${c.bk}" oninput="st.cfg.bk=this.value"></label><label>নগদ নম্বর<input value="${c.ng}" oninput="st.cfg.ng=this.value"></label><label>অনলাইন পেমেন্টে ছাড় (%)<input type="number" value="${c.dc}" oninput="st.cfg.dc=+this.value"></label><label>Admin password<input value="${esc(c.pw)}" oninput="st.cfg.pw=this.value"></label><label>কভার ছবি বদলান<input type="file" accept="image/*" onchange="fileData(this.files[0],1400).then(d=>{st.cover=d;save();render()})"></label><button class="bt" onclick="save();render();alert('সেভ হয়েছে')">সেভ করুন</button> <button class="bt o" onclick="if(confirm('সব ডেটা প্রথম অবস্থায় ফিরবে। নিশ্চিত?')){localStorage.removeItem('ug');location.reload()}">রিসেট</button>`}
 const a=$('#adm');a.hidden=false;a.innerHTML=`<div style="max-width:640px;margin:auto"><div class="row"><h2 style="flex:1">Admin</h2><button class="bt o" onclick="gate.ok=0;location.hash=''">বন্ধ করুন</button></div><div class="tb">${T('p','ঘড়ি')}${T('b','ব্র্যান্ড')}${T('r','রিভিউ')}${T('o','অর্ডার ('+st.orders.length+')')}${T('s','সেটিংস')}</div>${b}</div>`}
async function addImgs(fs){for(const x of fs)dr.imgs.push({c:'রং '+(dr.imgs.length+1),src:await fileData(x)});ad()}
function saveP(){if(!dr.name||!dr.price||!dr.imgs.length)return alert('নাম, দাম ও অন্তত একটি ছবি দিন');if(dr.id){st.products=st.products.map(p=>p.id==dr.id?dr:p)}else{dr.id=Date.now();st.products.unshift(dr)}save();dr=null;render();ad()}
async function addRv(){const x=$('#ri').files[0],n=$('#rn').value.trim(),t=$('#rt').value.trim();if(!x&&!t)return alert('ছবি বা লেখা দিন');st.reviews.unshift({name:n||'কাস্টমার',txt:t,img:x?await fileData(x,600):''});save();render();ad()}
render();gate();
</script></body></html>
